<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0e1116"><title>ひと息タイマー</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#0e1116;color:#e9e4d8;font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}a{color:#d9a441}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;touch-action:manipulation}
#orb{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#6fa8c9,#2c4a63 70%);box-shadow:0 0 60px rgba(111,168,201,.35);transform:scale(.55);transition:transform 4s ease-in-out}
#lab{font-size:30px;letter-spacing:.2em;min-height:42px}#tm{font-size:15px;color:#9a968c}
.row{display:flex;gap:10px}button{font:inherit;font-size:16px;color:#e9e4d8;background:#1a2029;border:1px solid #3a4250;border-radius:10px;padding:12px 18px;min-height:44px}
button.on{border-color:#d9a441;color:#d9a441}#note{font-size:12px;color:#7d7a72;max-width:300px;text-align:center;line-height:1.7}
#back{position:fixed;left:12px;top:max(12px,env(safe-area-inset-top));font-size:13px}
</style></head><body><a id="back" href="../">← 作品一覧</a>
<div id="orb"></div><div id="lab">ひと息</div><div id="tm">時間を選んで 開始</div>
<div class="row"><button class="d" data-m="1">1分</button><button class="d on" data-m="3">3分</button><button class="d" data-m="5">5分</button></div>
<div class="row"><button id="go">開始</button></div>
<div id="note">吸う4秒・止める2秒・吐く6秒をくり返す、ただのタイマーです。治療や医療を目的としたものではありません。</div>
<script>
(()=>{const orb=document.getElementById('orb'),lab=document.getElementById('lab'),tm=document.getElementById('tm'),go=document.getElementById('go');
let mins=3,run=false,timer=null,tick=null,end=0;
document.querySelectorAll('.d').forEach(b=>b.onclick=()=>{if(run)return;mins=+b.dataset.m;document.querySelectorAll('.d').forEach(x=>x.classList.toggle('on',x===b));});
const ph=[['吸う',4,1],['止める',2,1],['吐く',6,.55],['止める',0,.55]];
function step(i){if(!run)return;const[n,s,sc]=ph[i];if(s===0){step((i+1)%4);return;}lab.textContent=n;orb.style.transitionDuration=s+'s';orb.style.transform='scale('+sc+')';timer=setTimeout(()=>step((i+1)%4),s*1000);}
function stop(msg){run=false;clearTimeout(timer);clearInterval(tick);orb.style.transitionDuration='1s';orb.style.transform='scale(.55)';lab.textContent=msg||'ひと息';go.textContent='開始';}
go.onclick=()=>{if(run){stop();tm.textContent='とめました';return;}run=true;go.textContent='とめる';end=Date.now()+mins*60000;step(0);
 const upd=()=>{const r=Math.max(0,Math.round((end-Date.now())/1000));tm.textContent='のこり '+Math.floor(r/60)+':'+String(r%60).padStart(2,'0');if(r<=0){stop('おつかれさま');tm.textContent='おわり';}};upd();tick=setInterval(upd,500);};
})();
</script></body></html>
