<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0e1116"><title>粒子の庭</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#0e1116;color:#e9e4d8;font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}a{color:#d9a441}
canvas{position:fixed;inset:0;width:100%;height:100%}
#bar{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
button{font:inherit;font-size:16px;color:#e9e4d8;background:#1a2029;border:1px solid #3a4250;border-radius:10px;padding:12px 18px;min-height:44px}
#hint{position:fixed;top:max(16px,env(safe-area-inset-top));left:0;right:0;text-align:center;color:#9a968c;font-size:14px;pointer-events:none;transition:opacity 1.5s}
#back{position:fixed;left:12px;top:max(12px,env(safe-area-inset-top));font-size:13px;z-index:2}
</style></head><body><canvas id="c"></canvas><a id="back" href="../">← 作品一覧</a>
<div id="hint">指でなぞると、光の粒が咲く</div>
<div id="bar"><button id="m">ほたる</button><button id="x">消す</button></div>
<script>
(()=>{const c=document.getElementById('c'),g=c.getContext('2d');let W,H,dpr;
function rs(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle='#0e1116';g.fillRect(0,0,W,H);}addEventListener('resize',rs);rs();
const modes=['ほたる','花火','うずまき'];let mode=0,hue=190,P=[],down=false,lx=0,ly=0,t=0,sp=0;
const hint=document.getElementById('hint');
function emit(x,y,vx,vy){hue=(hue+2)%360;
 if(mode===0){for(let i=0;i<3;i++)P.push({x,y,vx:(Math.random()-.5)*.8+vx*.1,vy:(Math.random()-.5)*.8-.3+vy*.1,l:1,d:.012,r:2+Math.random()*2.5,h:hue});}
 else if(mode===1){for(let i=0;i<14;i++){const a=Math.random()*6.283,s=1+Math.random()*3;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:.02,r:1.6,h:hue+Math.random()*40,g:.05});}}
 else{for(let i=0;i<2;i++){const a=t*.2+i*3.1416;P.push({x,y,vx:Math.cos(a)*1.4,vy:Math.sin(a)*1.4,l:1,d:.01,r:2.2,h:hue,sw:.06});}}}
function pt(e){return [e.clientX,e.clientY]}
addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON'||e.target.tagName==='A')return;down=true;[lx,ly]=pt(e);hint.style.opacity=0;emit(lx,ly,0,0);});
addEventListener('pointermove',e=>{if(!down)return;const[x,y]=pt(e);const dx=x-lx,dy=y-ly,n=Math.min(8,Math.ceil(Math.hypot(dx,dy)/10));for(let i=1;i<=n;i++)emit(lx+dx*i/n,ly+dy*i/n,dx,dy);lx=x;ly=y;});
addEventListener('pointerup',()=>down=false);addEventListener('pointercancel',()=>down=false);
document.getElementById('m').onclick=e=>{mode=(mode+1)%3;e.target.textContent=modes[mode];};
document.getElementById('x').onclick=()=>{P=[];g.fillStyle='#0e1116';g.fillRect(0,0,W,H);};
function loop(){requestAnimationFrame(loop);t++;g.fillStyle='rgba(14,17,22,.12)';g.fillRect(0,0,W,H);g.globalCompositeOperation='lighter';
 for(const p of P){if(p.g)p.vy+=p.g;if(p.sw){const a=Math.atan2(p.vy,p.vx)+p.sw,s=Math.hypot(p.vx,p.vy);p.vx=Math.cos(a)*s;p.vy=Math.sin(a)*s;}p.x+=p.vx;p.y+=p.vy;p.l-=p.d;
  g.fillStyle='hsla('+p.h+',80%,62%,'+Math.max(0,p.l*.8)+')';g.beginPath();g.arc(p.x,p.y,p.r*(.5+p.l*.5),0,6.283);g.fill();}
 g.globalCompositeOperation='source-over';P=P.filter(p=>p.l>0);if(P.length>1500)P.splice(0,P.length-1500);}
loop();})();
</script></body></html>
